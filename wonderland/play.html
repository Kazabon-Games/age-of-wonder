<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wonderland: First Principles</title>

<!--
  WONDERLAND: FIRST PRINCIPLES — CHANGE LOG
  (one line per change, most recent on top)

  v0.1.0 — 2026-07-24 — Phase 0: scaffold only. Version marker, changelog,
                          theme toggle, screen-switching shell, engine
                          scripts wired in. No playable content yet —
                          that's Checkpoint 9's remaining tasks.
-->

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Palette matches aow_play_sheet.html's own tokens — Wonderland is
     part of the same suite and should read as visually continuous with
     it, not a separately-invented look. Architecture A (raw palette
     tokens swapped directly per theme) — matches that sibling file's
     own approach, not chosen fresh here. */
  :root{
    --night:#0f0d0a;
    --night-2:#161310;
    --night-panel:#1a1410;
    --vellum:#f2e8d0;
    --vellum-dim:rgba(242,232,208,0.6);
    --vellum-faint:rgba(242,232,208,0.4);
    --gold:#8b6914;
    --gold-bright:#c9a030;
    --gold-dim:#9e7a48;
    --gold-faint:rgba(201,169,110,0.15);
    --forest:#2c4a3a;
    --forest-bright:#3a6b50;
    --crimson:#8c3a1a;
    --crimson-bright:#b84820;
    --panel-border:rgba(139,105,20,0.18);
    --border-mid:rgba(201,169,110,0.2);
  }
  html[data-theme="light"]{
    --night:#f2e8d0;
    --night-2:#ebe1cc;
    --night-panel:#e5d9bd;
    --vellum:#241e17;
    --vellum-dim:rgba(36,30,23,0.7);
    --vellum-faint:rgba(36,30,23,0.5);
    --panel-border:rgba(58,45,30,0.22);
    --border-mid:rgba(58,45,30,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--night);
    color:var(--vellum);
    font-family:'EB Garamond',serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  h1,h2,h3,.label,.eyebrow,button{font-family:'Cinzel',serif;}

  .version-marker{
    position:fixed;
    top:8px;
    right:10px;
    font-size:10px;
    color:var(--vellum-faint);
    opacity:0.5;
    letter-spacing:0.02em;
    font-family:monospace;
    z-index:50;
    pointer-events:none;
  }

  .theme-toggle{
    position:fixed;
    top:8px;
    left:10px;
    z-index:200;
    font-size:.65rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:.35rem .6rem;
    border:1px solid var(--gold-dim);
    background:var(--night-2);
    color:var(--gold);
    cursor:pointer;
    transition:all .2s;
    opacity:.85;
  }
  .theme-toggle:hover{opacity:1;}

  /* Screen-switching shell: exactly one .screen visible at a time, per
     Checkpoint 9 handover §2 — menus/non-combat screens are static/
     still DOM screens, no free-roam navigation between them. */
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
    min-height:100vh;
  }
  .screen.active{display:flex;}

  .eyebrow{
    font-size:.6rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:.6rem;
  }
  .screen-title{
    font-size:1.6rem;
    color:var(--vellum);
    margin:0 0 1rem 0;
    font-weight:600;
    text-align:center;
  }

  .btn{
    font-family:'Cinzel',serif;
    font-size:.72rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    padding:.7rem 1.2rem;
    border:1px solid var(--gold-dim);
    background:rgba(201,169,110,0.08);
    color:var(--gold);
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:rgba(201,169,110,0.16);border-color:var(--gold-bright);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  #app{display:flex;flex-direction:column;flex:1;}

  .house-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:1rem;
    width:100%;
    max-width:900px;
  }
  .house-card{
    text-align:left;
    font-family:'EB Garamond',serif;
    background:var(--night-panel);
    border:1px solid var(--panel-border);
    border-left:4px solid var(--house-primary, var(--gold-dim));
    padding:1rem;
    cursor:pointer;
    color:var(--vellum);
    transition:all .15s;
  }
  .house-card:hover{background:var(--night-2);}
  .house-card:active{transform:scale(0.98);}
  /*
   * House colors (colorPrimary/colorSecondary) are real per-house data,
   * but they were picked as identity swatches, not as text-safe colors
   * against an arbitrary theme background — found by actually looking
   * at both themes: House Ye/Lightwell's white reads invisible on the
   * light theme's cream background, House Corvane's near-black purple
   * reads invisible on the dark theme's near-black background. Kept
   * only as the decorative left-border accent (low-stakes if a little
   * low-contrast there); the actual house NAME always uses the theme's
   * own guaranteed-legible token instead of the raw house color.
   */
  .house-card-name{
    font-family:'Cinzel',serif;
    font-size:1rem;
    font-weight:600;
    color:var(--gold-bright);
    margin-bottom:.3rem;
  }
  .house-card-seat{
    font-size:.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--vellum-faint);
    margin-bottom:.5rem;
  }
  .house-card-kit{
    font-style:italic;
    font-size:.9rem;
    color:var(--vellum-dim);
    line-height:1.5;
  }

  /* Tutorial narration + outcome-transparency + victory screens */
  .tutorial-narration{
    max-width:640px;
    font-size:1.05rem;
    line-height:1.7;
    color:var(--vellum-dim);
    margin-bottom:1.5rem;
  }
  .tutorial-narration p{margin:0 0 1rem 0;}

  .outcome-panel{
    width:100%;
    max-width:640px;
    background:var(--night-panel);
    border:1px solid var(--panel-border);
    padding:1rem 1.2rem;
    margin-bottom:1.5rem;
  }
  .outcome-title{
    font-family:'Cinzel',serif;
    font-size:.65rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:.6rem;
  }
  .presence-row{
    display:flex;
    flex-wrap:wrap;
    gap:.8rem;
    font-size:.85rem;
    color:var(--vellum-dim);
    padding:.3rem 0;
    border-bottom:1px solid var(--border-mid);
  }
  .presence-label{
    font-family:'Cinzel',serif;
    font-size:.7rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--vellum);
    min-width:70px;
  }
  .outcome-initiative{
    margin-top:.6rem;
    font-size:.9rem;
    color:var(--vellum);
  }

  .victory-line{
    font-size:1.1rem;
    font-style:italic;
    color:var(--vellum);
    margin-bottom:.6rem;
  }
  .changelog-list{
    width:100%;
    max-width:560px;
    margin-bottom:1.5rem;
  }
  .changelog-entry{
    border-left:2px solid var(--gold-dim);
    padding:.2rem 0 .2rem .8rem;
    margin-bottom:.9rem;
  }
  .changelog-version{
    font-family:'Cinzel',serif;
    font-size:.65rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold-bright);
    margin-bottom:.2rem;
  }
  .changelog-summary{
    font-size:.92rem;
    color:var(--vellum-dim);
    line-height:1.5;
  }

  .victory-summary{
    font-size:.9rem;
    color:var(--vellum-dim);
    margin-bottom:1.5rem;
    text-align:center;
    max-width:520px;
  }
</style>
</head>
<body>
<div class="version-marker" id="versionMarker">Wonderland — v0.1.0</div>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀ Light</button>

<div id="app">
  <!-- Screens are populated by playUI.js; this shell only owns the
       switching mechanism and shared chrome (version marker, theme
       toggle). Real screen content lands in Checkpoint 9's later tasks. -->
  <div class="screen" id="screen-start"></div>
  <div class="screen" id="screen-house-select"></div>
  <div class="screen" id="screen-encounter"></div>
  <div class="screen" id="screen-victory"></div>
  <div class="screen" id="screen-updates"></div>
</div>

<script src="schema.js"></script>
<script src="engine.js"></script>
<script src="persistence.js"></script>
<script src="worldNpcs.js"></script>
<script src="houses.js"></script>
<script src="worldStateBridge.js"></script>
<script src="redemption.js"></script>
<script>
  // Theme toggle — light-dark-theme-toggle skill's standard pattern.
  // Default 'dark' matches :root's own default palette above (no
  // data-theme flash on first paint).
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    const btn = document.getElementById('theme-toggle');
    if(btn) btn.innerHTML = theme === 'light' ? '☾ Dark' : '☀ Light';
    try{ localStorage.setItem('wonderland-play-theme', theme); }catch(e){}
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  }
  (function initTheme(){
    let saved = 'dark';
    try{ saved = localStorage.getItem('wonderland-play-theme') || 'dark'; }catch(e){}
    applyTheme(saved);
  })();
</script>
<script src="tutorial.js"></script>
<script src="playUI.js"></script>
</body>
</html>
